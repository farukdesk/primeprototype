// Top-level build file. Configuration common to all sub-projects/modules
// is applied here through the Gradle plugin versions declared below.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // Firebase Cloud Messaging (push notifications). Applied in :app only when a
    // google-services.json is present, so the project still builds without it.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
