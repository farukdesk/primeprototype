plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Firebase Cloud Messaging (push notifications) ───────────────────────────
// The google-services plugin requires a google-services.json in this module.
// To keep the app buildable before Firebase is set up, we only apply it when
// that file exists. Drop the google-services.json from the Firebase console
// into student-portal-android/app/ to activate push notifications. See README.
if (rootProject.file("app/google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// ── Optional release signing ────────────────────────────────────────────────
// Create android-app/keystore.properties (never commit it) to enable signed
// release builds. See README for details. Debug builds work out-of-the-box.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'bd.ac.primeuniversity.studentportal'
    compileSdk 35

    defaultConfig {
        applicationId "bd.ac.primeuniversity.studentportal"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.0.8"

        // Base URL of the Prime University student API. Override here if your
        // server differs. No trailing slash. Exposed to code as BuildConfig.
        buildConfigField "String", "API_BASE_URL",
                "\"https://primeuniversity.ac.bd/admin/api/student/\""

        // Base URL of the staff/employee API (admin API root). Hosts the
        // auth, staff/* and push/register.php endpoints used by the staff view.
        buildConfigField "String", "STAFF_API_BASE_URL",
                "\"https://primeuniversity.ac.bd/admin/api/\""

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // ── Distribution channels ────────────────────────────────────────────────
    // 'play'      : Google Play build. The self-hosted APK update prompt is
    //               compiled out (Play policy forbids self-updating apps).
    // 'selfhosted': APK distributed from the university server; keeps the
    //               in-app update prompt driven by admin/api/app-version.php.
    flavorDimensions = ['distribution']

    productFlavors {
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', 'false'
        }
        selfhosted {
            dimension 'distribution'
            buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Kotlin + coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // AndroidX core / UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Firebase Cloud Messaging (push notifications from the admin panel)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Secure on-device token storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Image loading (student photo / attachments preview)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // QR code generation for the digital student ID card
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
